[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-signage"
dynamic = ["version"]
description = "Standalone digital signage for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_signage"]

[tool.hatch.version]
path = "src/open_signage/version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
