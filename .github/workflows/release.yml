name: GitHub-Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release-Seite erstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release-Notizen aus dem Changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md enthält keinen Abschnitt für ${version}"
            exit 1
          fi
          cat release-notes.md
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "Open Signage ${GITHUB_REF_NAME}" --notes-file release-notes.md
