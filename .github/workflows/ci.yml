name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 entspricht Raspberry Pi OS Bookworm.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: FFmpeg installieren
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Abhängigkeiten installieren
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  shell:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax und ShellCheck
        run: |
          mapfile -t scripts < <(grep -l -E '^#!(/usr/bin/env bash|/bin/bash|/bin/sh)' deploy/* scripts/*)
          printf 'Prüfe %s\n' "${scripts[@]}"
          for script in "${scripts[@]}"; do bash -n "${script}"; done
          shellcheck --severity=error "${scripts[@]}"

  release-consistency:
    name: Version und Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version ist im Changelog dokumentiert
        run: |
          version="$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/open_signage/version.py").read_text()).group(1))')"
          grep -q "^## \[${version}\] – " CHANGELOG.md || { echo "CHANGELOG.md enthält keinen Abschnitt für ${version}"; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu Version ${version}"; exit 1
          fi
