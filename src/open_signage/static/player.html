<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Signage Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b4965'/%3E%3Cpath d='M15 18h34v24H15z' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M25 49h14' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <meta name="open-signage-version" content="@@VERSION@@">
  <link rel="stylesheet" href="/static/style.css?v=@@VERSION@@">
</head>
<body class="player">
  <div id="stage" class="stage">
    <div id="placeholder" class="placeholder">
      <strong>Open Signage</strong>
      <span>Warte auf Inhalte …</span>
    </div>
  </div>
  <form id="player-pair-form" class="player-pair" hidden>
    <strong>Player freischalten</strong>
    <span>Dieses Netzwerkgerät muss einmalig autorisiert werden.</span>
    <label>Administratorpasswort<input name="password" type="password" autocomplete="current-password" required></label>
    <button>Player starten</button>
    <small id="player-pair-error" role="alert"></small>
  </form>
  <script src="/static/vendor/hls.min.js?v=@@VERSION@@"></script>
  <script src="/static/whep.js?v=@@VERSION@@"></script>
  <script src="/static/player.js?v=@@VERSION@@"></script>
</body>
</html>
